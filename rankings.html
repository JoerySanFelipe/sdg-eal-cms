<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings | UCU – EAL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/style.css">
  
  <script src="./js/rankings-data.js" defer></script>
  <script src="./js/institutional-data.js" defer></script>

  <script src="./js/core-ui.js" defer></script>
  <script src="./js/visual-media.js" defer></script>
  <script src="./js/impact-feeds.js" defer></script>
  <script src="./js/firebase-public-sync.js" defer></script>
</head>

<body class="bg-canvas text-main2 font-sans antialiased min-h-screen flex flex-col relative z-0 overflow-x-hidden">
  
  <ucu-header base-path="./"></ucu-header>

  <ucu-hero-banner 
    class="block w-full min-h-[320px] md:min-h-[360px]"
    bg-color="bg-ucu-blue-dark" 
    eyebrow="A Network of Excellence"
    headline="Connecting UCU"
    highlight="Globally"
    description="Forging high-impact relationships with global academic institutions and premier industry leaders to elevate the educational standard of Urdaneta City University.">
  </ucu-hero-banner>

  <main class="w-full flex-grow relative z-10 flex flex-col bg-canvas">

    <section class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 relative z-20 pt-12 mb-24 reveal opacity-0 translate-y-8 transition-all duration-[800ms] ease-[cubic-bezier(0.16,1,0.3,1)] delay-100">      
      
      <div class="flex items-center justify-between w-full mb-8 gap-4">
        <h2 id="standing-title" class="flex-shrink-0 text-2xl sm:text-3xl md:text-4xl font-black text-ucu-blue-dark tracking-tight m-0 pr-2 font-sans">Current Global Standing</h2>
        <div class="flex-grow h-px bg-slate-200/80 rounded-full hidden sm:block"></div>
      </div>
      
      <ucu-ranking-carousel class="block w-full min-h-[350px] md:min-h-[400px]"></ucu-ranking-carousel>

    </section>

    <section class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 relative z-20 mb-24">
      <div class="w-full">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-8">
          <div>
            <h2 id="trajectory-eyebrow" class="text-xs font-black uppercase tracking-[0.2em] text-muted mb-3">Institutional Trajectory</h2>
            <h3 id="trajectory-title" class="text-3xl md:text-4xl font-black text-ucu-blue-dark">Historical Performance</h3>
          </div>

          <div class="flex flex-wrap gap-2.5" id="filter-group">
            <button data-filter="all" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-ucu-blue-dark data-[active=true]:text-white data-[active=true]:border-ucu-blue-dark text-main2" data-active="true">All Rankings</button>
            <button data-filter="WURI" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-[#0f4088] data-[active=true]:text-white data-[active=true]:border-[#0f4088] text-main2" data-active="false">WURI</button>
            <button data-filter="UI GreenMetric" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-[#00993d] data-[active=true]:text-white data-[active=true]:border-[#00993d] text-main2" data-active="false">UI GreenMetric</button>
            <button data-filter="THE" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-[#201f1f] data-[active=true]:text-white data-[active=true]:border-[#201f1f] text-main2" data-active="false">THE Impact</button>
            <button data-filter="AppliedHE" class="filter-btn px-4 py-2 rounded-full text-xs font-bold border border-white/50 bg-white/60 transition-all hover:bg-white hover:shadow-sm data-[active=true]:bg-[#f26422] data-[active=true]:text-white data-[active=true]:border-[#f26422] text-main2" data-active="false">AppliedHE</button>
          </div>
        </div>

        <ucu-ranking-timeline></ucu-ranking-timeline>

      </div>
    </section>

  </main>

  <ucu-footer base-path="./"></ucu-footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Scroll Reveal Observer
      const revealTargets = document.querySelectorAll(".reveal");
      if (revealTargets.length > 0) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.remove("opacity-0", "translate-y-8");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
        revealTargets.forEach((el) => observer.observe(el));
      }

      // 2. Dynamic Timeline Filtering Logic
      const buttons = document.querySelectorAll('.filter-btn');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const filter = btn.getAttribute('data-filter');
          
          // Toggle active visual states on buttons
          buttons.forEach(b => b.setAttribute('data-active', 'false'));
          btn.setAttribute('data-active', 'true');

          let visibleCount = 0;
          
          // Dynamically query the timeline items generated by the Web Component
          const items = document.querySelectorAll('ucu-ranking-timeline .timeline-item');
          const emptyState = document.getElementById('empty-state');

          items.forEach(item => {
            const org = item.getAttribute('data-org');
            if (filter === 'all' || org === filter) {
              item.style.display = 'flex';
              item.classList.add('opacity-0', 'scale-95');
              
              // Force a rapid reflow to ensure the animation triggers properly
              void item.offsetWidth; 
              
              setTimeout(() => {
                item.classList.remove('opacity-0', 'scale-95');
              }, 50);
              visibleCount++;
            } else {
              item.style.display = 'none';
            }
          });

          if (emptyState) {
            emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
