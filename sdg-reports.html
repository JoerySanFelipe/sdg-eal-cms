<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

  <meta property="og:title" content="SDG Reports | UCU">
  <meta property="og:description" content="Explore UCU's contributions to all 17 Sustainable Development Goals.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="icon" href="./images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/style.css">
  
  <script src="./js/events-data.js" defer></script>
  <script src="./js/research-data.js" defer></script>
  <script src="./js/partners-data.js" defer></script>
  <script src="./js/institutional-data.js" defer></script>

  <script src="./js/core-ui.js" defer></script>  
  <script src="./js/visual-media.js" defer></script>
  <script src="./js/block-renderer.js" defer></script>
  <script src="./js/global-charts.js" defer></script>
  <script src="./js/modals.js" defer></script>

<body class="bg-canvas text-main2 font-sans antialiased min-h-screen flex flex-col relative z-0 overflow-x-hidden">
  
  <ucu-header base-path="./"></ucu-header>

  <ucu-hero-banner 
    bg-color="bg-ucu-blue-dark" 
    eyebrow="Local Action. Global Impact."
    headline="SDG Reports"
    highlight="2025"
    description="Documenting Urdaneta City University’s measurable contributions to the United Nations Sustainable Development Goals through education, research, partnerships, and community-driven initiatives in 2025.">
  </ucu-hero-banner>

  <main class="w-full flex-grow relative z-10 flex flex-col gap-12 md:gap-16 py-10 md:py-12 bg-canvas">
    
    <section class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 lg:px-8 relative z-20 reveal-on-scroll" style="transition-delay: 100ms;">
      <ucu-metric-cards
        data-metrics='[
          {"value": "169", "label": "Targets", "theme": "white", "icon": "target"},
          {"value": "48", "label": "Events", "theme": "navy", "icon": "calendar"},
          {"value": "124", "label": "Research", "theme": "red", "icon": "book-open"}
        ]'
      ></ucu-metric-cards>
    </section>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-0 w-full overflow-hidden shadow-lg border border-white/50 bg-white/60">
        <sdg-card goal-num="1" title="No Poverty" subtitle="End poverty in all its forms everywhere." color="#E5243B" bg-img="./images/sdg/bg/1.png" logo-img="./images/sdg/sdg1.png" targets="7" events="0" research="342" explore-link="sdg-reports/sdg1.html"></sdg-card>
        <sdg-card goal-num="2" title="Zero Hunger" subtitle="End hunger, achieve food security and improved nutrition." color="#DDA63A" bg-img="./images/sdg/bg/2.png" logo-img="./images/sdg/sdg2.png" targets="8" events="0" research="215" explore-link="sdg-reports/sdg2.html"></sdg-card>

        <sdg-card goal-num="6" title="Clean Water and Sanitation" subtitle="Ensure availability and sustainable management of water." color="#26BDE2" bg-img="./images/sdg/bg/6.png" logo-img="./images/sdg/sdg6.png" targets="8" events="0" research="450" explore-link="sdg-reports/sdg6.html"></sdg-card>
        <sdg-card goal-num="7" title="Affordable and Clean Energy" subtitle="Ensure access to affordable, reliable, sustainable energy." color="#FCC30B" bg-img="./images/sdg/bg/7.png" logo-img="./images/sdg/sdg7.png" targets="5" events="0" research="678" explore-link="sdg-reports/sdg7.html"></sdg-card>

        <sdg-card goal-num="13" title="Climate Action" subtitle="Take urgent action to combat climate change and its impacts." color="#3F7E44" bg-img="./images/sdg/bg/13.png" logo-img="./images/sdg/sdg13.png" targets="5" events="0" research="899" explore-link="sdg-reports/sdg13.html"></sdg-card>
        <sdg-card goal-num="14" title="Life Below Water" subtitle="Conserve and sustainably use the oceans, seas and marine resources." color="#0A97D9" bg-img="./images/sdg/bg/14.png" logo-img="./images/sdg/sdg14.png" targets="10" events="0" research="210" explore-link="sdg-reports/sdg14.html"></sdg-card>
        <sdg-card goal-num="15" title="Life on Land" subtitle="Protect, restore and promote sustainable use of terrestrial ecosystems." color="#56C02B" bg-img="./images/sdg/bg/15.png" logo-img="./images/sdg/sdg15.png" targets="12" events="0" research="345" explore-link="sdg-reports/sdg15.html"></sdg-card>
        <sdg-card goal-num="16" title="Peace, Justice and Strong Institutions" subtitle="Promote peaceful and inclusive societies for sustainable development." color="#00689D" bg-img="./images/sdg/bg/16.png" logo-img="./images/sdg/sdg16.png" targets="12" events="0" research="412" explore-link="sdg-reports/sdg16.html"></sdg-card>
        <sdg-card goal-num="17" title="Partnerships for the Goals" subtitle="Strengthen the means of implementation and revitalize the global partnership." color="#19486A" bg-img="./images/sdg/bg/17.png" logo-img="./images/sdg/sdg17.jpg" targets="19" events="0" research="126" explore-link="sdg-reports/sdg17.html"></sdg-card>

      </div>
    </section>

  </main>

  <ucu-footer base-path="./" class="reveal-on-scroll"></ucu-footer>
